#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # TODO: Re-enable once compatible with DuckDB main (SetOperationNode API change)
  # duckdb-next-build:
  #  name: Build extension binaries
  #  uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
  #  with:
  #    duckdb_version: main
  #    ci_tools_version: main
  #    extension_name: parser_tools

  duckdb-stable-build:
    name: Build extension binaries
    # ci-tools v1.4.5 finds VS 2026's vcvars on windows-latest; v1.4.4 only
    # knows the VS 2022 path, so windows_amd64 silently built with MinGW gcc.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.5
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.5
      extension_name: parser_tools
